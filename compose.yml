services:
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ran_twin
      POSTGRES_USER: ran_admin
      POSTGRES_PASSWORD: ran_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ran_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ran_admin -d ran_twin"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ran_postgis_data:

